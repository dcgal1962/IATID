<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AM The Instructional Designer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* full-screen organism canvas sits behind everything */
    #c { position: fixed; inset: 0; z-index: 0; }

    /* course iframe floats above canvas */
    #course { position: fixed; z-index: 2; border: none; }

    /* ── floating brand (no box) ── */
    .brand {
      position: fixed; top: 22px; left: 26px;
      z-index: 10; pointer-events: none;
    }
    .brand-name {
      font-size: 13px; font-weight: 700;
      background: linear-gradient(90deg, rgba(255,255,255,.85) 0%, #00d4ff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .brand-sub {
      display: block; font-size: 9px; font-weight: 400;
      letter-spacing: .12em; text-transform: uppercase;
      color: rgba(255,255,255,.20); margin-top: 3px;
    }

    /* ── minimal pill buttons ── */
    .actions {
      position: fixed; top: 18px; right: 22px;
      z-index: 10; display: flex; gap: 8px;
    }
    .pill {
      padding: 7px 18px; border-radius: 99px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.45);
      color: rgba(255,255,255,.40);
      font: 500 11px 'Inter', sans-serif;
      cursor: pointer; transition: all .25s;
      backdrop-filter: blur(12px);
    }
    .pill:hover {
      background: rgba(0,212,255,.10);
      border-color: rgba(0,212,255,.35);
      color: #00d4ff;
    }

    /* ── live badge ── */
    .live {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
      z-index: 10; display: flex; align-items: center; gap: 7px;
      font-size: 9px; font-weight: 600; letter-spacing: .18em;
      text-transform: uppercase; color: rgba(16,185,129,.48);
      pointer-events: none;
    }
    .live-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: #10b981; box-shadow: 0 0 7px #10b981;
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.15} }

    /* ── verb labels rise from the organism ── */
    .evt-label {
      position: fixed; z-index: 8; pointer-events: none;
      font-size: 11px; font-weight: 600;
      text-transform: capitalize; letter-spacing: .04em;
      transform: translateX(-50%);
      animation: rise 4s ease-out forwards;
    }
    @keyframes rise {
      0%   { opacity:0; transform:translateX(-50%) translateY(0)    scale(.55); }
      13%  { opacity:1; transform:translateX(-50%) translateY(-10px) scale(1);  }
      78%  { opacity:.75; }
      100% { opacity:0; transform:translateX(-50%) translateY(-90px) scale(.82); }
    }

    /* ── statement counter lives inside the nucleus ── */
    #count {
      position: fixed; z-index: 6; pointer-events: none;
      text-align: center; transform: translate(-50%,-50%);
    }
    #count-num {
      display: block; font-size: 52px; font-weight: 900; line-height: 1;
      background: linear-gradient(135deg, #00d4ff 0%, #8b5cf6 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: -.04em;
      transition: transform .28s cubic-bezier(.175,.885,.32,1.275);
    }
    #count-lbl {
      display: block; font-size: 8px; font-weight: 600;
      letter-spacing: .22em; text-transform: uppercase;
      color: rgba(0,212,255,.32); margin-top: 5px;
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<iframe id="course" src="story.html"
  title="Learning Engineer Dashboard"
  allow="autoplay; fullscreen">
</iframe>

<div class="brand">
  <div class="brand-name">AM The Instructional Designer</div>
  <span class="brand-sub">Learning Engineer · xAPI Live</span>
</div>

<div class="actions">
  <button class="pill" id="btn-clear">Clear</button>
  <button class="pill" id="btn-dl">Export JSON</button>
</div>

<div class="live"><div class="live-dot"></div>xAPI Live Capture</div>

<div id="count">
  <span id="count-num">0</span>
  <span id="count-lbl">statements</span>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════
   CANVAS + LAYOUT
═══════════════════════════════════════════ */
const C   = document.getElementById('c');
const ctx = C.getContext('2d');
let W, H, OX, OY, IX, IY, IW, IH;

function layout() {
  W = C.width  = window.innerWidth;
  H = C.height = window.innerHeight;

  OX = W * 0.795;   // organism centre x
  OY = H * 0.500;   // organism centre y

  IW = W * 0.555;   // iframe width
  IH = H * 0.880;   // iframe height
  IX = W * 0.024;   // iframe left
  IY = (H - IH) * 0.5;

  document.getElementById('course').style.cssText =
    `left:${IX}px;top:${IY}px;width:${IW}px;height:${IH}px`;

  const cd = document.getElementById('count');
  cd.style.left = OX + 'px';
  cd.style.top  = OY + 'px';
}
window.addEventListener('resize', layout);

/* ═══════════════════════════════════════════
   NOISE  —  3-octave fBm
═══════════════════════════════════════════ */
function fbm(x, y, t) {
  return (
    Math.sin(x * 2.10 + t)        * Math.cos(y * 1.90 - t * .70) * .500 +
    Math.sin(x * 4.30 - t * .90)  * Math.cos(y * 3.80 + t * .40) * .250 +
    Math.sin(x * 8.10 + y * 6.50  + t * 1.30)                    * .125
  );
}

/* ═══════════════════════════════════════════
   BLOB HELPERS
═══════════════════════════════════════════ */
function blobPts(cx, cy, r, freq, amp, t, spd, N) {
  N = N || 64;
  const pts = [];
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2;
    const d = r + fbm(Math.cos(a) * freq, Math.sin(a) * freq, t * spd) * amp;
    pts.push({ x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d });
  }
  return pts;
}

function smoothPath(pts) {
  const n = pts.length;
  ctx.beginPath();
  ctx.moveTo((pts[0].x + pts[n - 1].x) * .5, (pts[0].y + pts[n - 1].y) * .5);
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    ctx.quadraticCurveTo(a.x, a.y, (a.x + b.x) * .5, (a.y + b.y) * .5);
  }
  ctx.closePath();
}

function hexRGB(h) {
  return `${parseInt(h.slice(1,3),16)},${parseInt(h.slice(3,5),16)},${parseInt(h.slice(5,7),16)}`;
}

/* ═══════════════════════════════════════════
   PULSE STATE
═══════════════════════════════════════════ */
const pulse = { color: '#00d4ff', alpha: 0, scale: 1, rings: [] };

function triggerPulse(color) {
  pulse.color = color;
  pulse.alpha = 1;
  pulse.scale = 1.18;
  // spawn two rings in quick succession
  pulse.rings.push({ r: 50, alpha: 1, color });
  setTimeout(() => pulse.rings.push({ r: 50, alpha: .7, color }), 180);
}

/* ═══════════════════════════════════════════
   LIVING TENDRILS  —  grow & retract from edge
═══════════════════════════════════════════ */
const tendrils = Array.from({ length: 10 }, (_, i) => {
  const ml = 50 + Math.random() * 80;
  return {
    angle:   (i / 10) * Math.PI * 2 + Math.random() * .4,
    length:  Math.random() * ml,
    maxLen:  ml,
    growing: Math.random() < .5,
    phase:   Math.random() * Math.PI * 2,
    spd:     .38 + Math.random() * .55,
  };
});

function drawTendrils(t) {
  const bodyR = 158 * pulse.scale;
  for (const td of tendrils) {
    if (td.growing) {
      td.length = Math.min(td.length + .75, td.maxLen);
      if (td.length >= td.maxLen) td.growing = false;
    } else {
      td.length -= .50;
      if (td.length <= 0) {
        td.angle  = Math.random() * Math.PI * 2;
        td.maxLen = 50 + Math.random() * 80;
        td.growing = true;
        td.phase  = Math.random() * Math.PI * 2;
        td.length = 0;
      }
    }
    const bx = OX + Math.cos(td.angle) * bodyR;
    const by = OY + Math.sin(td.angle) * bodyR;
    const frac = td.length / td.maxLen;

    ctx.beginPath();
    for (let k = 0; k <= 12; k++) {
      const p   = k / 12;
      const len = td.length * p;
      const w   = Math.sin(p * Math.PI * 2.5 + t * td.spd + td.phase) * (1 - p) * 16;
      const px  = bx + Math.cos(td.angle) * len + Math.cos(td.angle + Math.PI * .5) * w;
      const py  = by + Math.sin(td.angle) * len + Math.sin(td.angle + Math.PI * .5) * w;
      k === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.strokeStyle = `rgba(0,212,255,${frac * .22})`;
    ctx.lineWidth   = (1 - frac) * 1.4 + .25;
    ctx.stroke();
  }
}

/* ═══════════════════════════════════════════
   ORGANELLES  —  drift inside the organism body
═══════════════════════════════════════════ */
const organelles = Array.from({ length: 14 }, () => ({
  angle: Math.random() * Math.PI * 2,
  orb:   16 + Math.random() * 58,
  aspd:  (.002 + Math.random() * .003) * (Math.random() < .5 ? 1 : -1),
  size:  6 + Math.random() * 15,
  phase: Math.random() * Math.PI * 2,
  bspd:  .30 + Math.random() * .50,
}));

/* ═══════════════════════════════════════════
   ORGANISM  —  drawn with additive (screen) blend
   for true bioluminescent glow
═══════════════════════════════════════════ */
function drawOrganism(t) {
  const cx = OX, cy = OY, ps = pulse.scale;
  const pa = pulse.alpha, pc = pulse.color;

  ctx.save();
  ctx.globalCompositeOperation = 'screen';

  /* 1 · vast outer aura */
  smoothPath(blobPts(cx, cy, 278 * ps, .60, 68, t, .09, 64));
  { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 360 * ps);
    g.addColorStop(0, 'rgba(70,15,150,.11)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fill(); }

  /* 2 · outer body — violet */
  smoothPath(blobPts(cx, cy, 170 * ps, .90, 50, t, .20, 72));
  { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 238 * ps);
    const ic = pa > 0
      ? `rgba(${hexRGB(pc)},${.25 + pa * .20})`
      : 'rgba(95,22,195,.25)';
    g.addColorStop(0,   ic);
    g.addColorStop(.60, 'rgba(30,6,85,.11)');
    g.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fill(); }

  /* 3 · inner body — cyan */
  smoothPath(blobPts(cx, cy, 136 * ps, 1.20, 34, t, .28, 68));
  { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 182 * ps);
    const ic = pa > 0
      ? `rgba(${hexRGB(pc)},${.22 + pa * .18})`
      : 'rgba(0,165,215,.22)';
    g.addColorStop(0, ic);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fill(); }

  /* 4 · organelles drifting inside body */
  for (const org of organelles) {
    org.angle += org.aspd;
    const ox = cx + Math.cos(org.angle) * org.orb * ps;
    const oy = cy + Math.sin(org.angle) * org.orb * ps * .78;
    const r  = org.size * (1 + Math.sin(t * org.bspd + org.phase) * .20) * ps;
    smoothPath(blobPts(ox, oy, r, 2.0, 4, t, .55, 24));
    const g = ctx.createRadialGradient(ox, oy, 0, ox, oy, r * 1.8);
    g.addColorStop(0, 'rgba(0,212,255,.24)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fill();
  }

  /* 5 · hot core */
  smoothPath(blobPts(cx, cy, 70 * ps, 1.80, 19, t, .42, 48));
  { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 98 * ps);
    const ic = pa > 0 ? `rgba(${hexRGB(pc)},.54)` : 'rgba(0,212,255,.50)';
    g.addColorStop(0, ic);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fill(); }

  ctx.restore();   /* back to normal blend */

  /* 6 · nucleus — white-hot centre */
  smoothPath(blobPts(cx, cy, 26 * ps, 2.8, 7, t, .70, 32));
  { const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 40 * ps);
    g.addColorStop(0,   'rgba(255,255,255,.92)');
    g.addColorStop(.28, 'rgba(0,212,255,.72)');
    g.addColorStop(1,   'rgba(0,212,255,0)');
    ctx.fillStyle = g; ctx.fill(); }

  /* 7 · expanding shockwave rings */
  for (let i = pulse.rings.length - 1; i >= 0; i--) {
    const ring = pulse.rings[i];
    ring.r    += 3.8;
    ring.alpha = Math.max(0, ring.alpha - .020);
    ctx.beginPath();
    ctx.arc(cx, cy, ring.r * ps, 0, Math.PI * 2);
    const ha = Math.floor(ring.alpha * 255).toString(16).padStart(2, '0');
    ctx.strokeStyle = ring.color + ha;
    ctx.lineWidth   = 1.5;
    ctx.stroke();
    if (ring.alpha <= 0) pulse.rings.splice(i, 1);
  }
}

/* ═══════════════════════════════════════════
   SATELLITE CELLS  —  elliptical orbits
═══════════════════════════════════════════ */
const CPALS = [
  ['rgba(0,212,255,',   'rgba(0,212,255,0)'],
  ['rgba(139,92,246,',  'rgba(139,92,246,0)'],
  ['rgba(232,121,249,', 'rgba(232,121,249,0)'],
  ['rgba(16,185,129,',  'rgba(16,185,129,0)'],
  ['rgba(99,102,241,',  'rgba(99,102,241,0)'],
  ['rgba(249,115,22,',  'rgba(249,115,22,0)'],
  ['rgba(0,212,255,',   'rgba(0,212,255,0)'],
];

const cells = Array.from({ length: 7 }, (_, i) => ({
  angle:  i / 7 * Math.PI * 2,
  orbitA: 195 + Math.random() * 115,
  orbitB: 112 + Math.random() * 72,
  spd:    (.0012 + Math.random() * .0018) * (Math.random() < .5 ? 1 : -1),
  r:      22 + Math.random() * 30,
  phase:  Math.random() * Math.PI * 2,
  pal:    CPALS[i],
  freq:   .80 + Math.random() * .90,
  amp:    7   + Math.random() * 10,
  bspd:   .28 + Math.random() * .45,
  cx: 0, cy: 0,
}));

function drawCells(t) {
  /* update positions first */
  for (const c of cells) {
    c.angle += c.spd;
    c.cx = OX + Math.cos(c.angle) * c.orbitA;
    c.cy = OY + Math.sin(c.angle) * c.orbitB;
  }

  /* thin tendrils back to nucleus (normal blend) */
  for (const c of cells) {
    const a = .020 + Math.abs(Math.sin(c.angle * 2)) * .025;
    ctx.beginPath();
    ctx.moveTo(c.cx, c.cy);
    ctx.quadraticCurveTo(
      (c.cx + OX) * .5 + Math.sin(t + c.phase) * 26,
      (c.cy + OY) * .5 + Math.cos(t + c.phase) * 18,
      OX, OY
    );
    ctx.strokeStyle = `rgba(0,212,255,${a})`;
    ctx.lineWidth   = .5;
    ctx.stroke();
  }

  /* cell bodies (additive blend for glow) */
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  for (const c of cells) {
    const r = c.r + Math.sin(t * c.bspd + c.phase) * 7;
    smoothPath(blobPts(c.cx, c.cy, r, c.freq, c.amp, t, c.bspd, 30));
    const g = ctx.createRadialGradient(c.cx, c.cy, 0, c.cx, c.cy, r + 18);
    g.addColorStop(0, c.pal[0] + '.26)');
    g.addColorStop(1, c.pal[1]);
    ctx.fillStyle = g;
    ctx.fill();
  }
  ctx.restore();
}

/* ═══════════════════════════════════════════
   AMBIENT SPORES
═══════════════════════════════════════════ */
const spores = Array.from({ length: 60 }, () => ({}));
function resetSpore(s) {
  s.x  = Math.random() * W;
  s.y  = Math.random() * H;
  s.vx = (Math.random() - .5) * .30;
  s.vy = (Math.random() - .5) * .30;
  s.r  = Math.random() * 1.2 + .3;
  s.a  = Math.random() * .26 + .04;
  s.col = Math.random() < .6 ? '0,212,255' : '139,92,246';
}
spores.forEach(resetSpore);

function drawSpores() {
  for (const s of spores) {
    s.x += s.vx; s.y += s.vy;
    if (s.x < -4 || s.x > W + 4 || s.y < -4 || s.y > H + 4) resetSpore(s);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${s.col},${s.a})`;
    ctx.fill();
  }
}

/* ═══════════════════════════════════════════
   ORGANIC MEMBRANE  —  wiggly border on iframe
═══════════════════════════════════════════ */
function drawMembrane(t) {
  if (!IW) return;
  const pad = 20;
  const x0 = IX - pad, y0 = IY - pad;
  const x1 = IX + IW + pad, y1 = IY + IH + pad;
  const N = 100, pts = [];

  for (let i = 0; i < N; i++) {
    const p = i / N;
    let bx, by;
    if      (p < .25) { const r =  p        / .25; bx = x0 + r * (x1 - x0); by = y0; }
    else if (p < .50) { const r = (p - .25) / .25; bx = x1;                 by = y0 + r * (y1 - y0); }
    else if (p < .75) { const r = (p - .50) / .25; bx = x1 - r * (x1 - x0); by = y1; }
    else              { const r = (p - .75) / .25; bx = x0;                 by = y1 - r * (y1 - y0); }

    const a = i / N * Math.PI * 2;
    const n = fbm(Math.cos(a) * 1.4, Math.sin(a) * 1.4, t * .30) * 13;
    pts.push({
      x: bx + Math.cos(a + Math.PI * .5) * n,
      y: by + Math.sin(a + Math.PI * .5) * n,
    });
  }

  smoothPath(pts);
  const glow = (Math.sin(t * .82) + 1) * .5;
  ctx.strokeStyle = `rgba(0,212,255,${.09 + glow * .09})`;
  ctx.lineWidth   = 1.2;
  ctx.shadowColor = '#00d4ff';
  ctx.shadowBlur  = 14;
  ctx.stroke();
  ctx.shadowBlur  = 0;
}

/* ═══════════════════════════════════════════
   NERVE SIGNALS  —  arc from iframe to organism
═══════════════════════════════════════════ */
const signals = [];

function fireSignal(color) {
  const sx = IX + IW;
  const sy = IY + IH * (.30 + Math.random() * .40);
  const s  = { sx, sy, ex: OX, ey: OY, p: 0, spd: .011 + Math.random() * .009, color };
  s.mx = (sx + OX) * .5 + (Math.random() - .5) * 95;
  s.my = (sy + OY) * .5 + (Math.random() - .5) * 55 - 40;
  signals.push(s);
}

function drawSignals() {
  for (let i = signals.length - 1; i >= 0; i--) {
    const s = signals[i];
    s.p = Math.min(s.p + s.spd, 1);
    const u = s.p, v = 1 - u;

    /* head position on bezier */
    const hx = v * v * s.sx + 2 * v * u * s.mx + u * u * s.ex;
    const hy = v * v * s.sy + 2 * v * u * s.my + u * u * s.ey;

    /* fading trail */
    const t0 = Math.max(0, s.p - .18);
    ctx.beginPath();
    let first = true;
    for (let k = 0; k <= 14; k++) {
      const tk = t0 + (s.p - t0) * (k / 14), vk = 1 - tk;
      const px = vk * vk * s.sx + 2 * vk * tk * s.mx + tk * tk * s.ex;
      const py = vk * vk * s.sy + 2 * vk * tk * s.my + tk * tk * s.ey;
      if (first) { ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
    }
    const al = Math.sin(s.p * Math.PI) * .88;
    ctx.strokeStyle = `rgba(${hexRGB(s.color)},${al})`;
    ctx.lineWidth   = 1.5;
    ctx.shadowColor = s.color;
    ctx.shadowBlur  = 9;
    ctx.stroke();
    ctx.shadowBlur  = 0;

    /* bright head */
    ctx.beginPath();
    ctx.arc(hx, hy, 3.5, 0, Math.PI * 2);
    ctx.fillStyle   = s.color;
    ctx.shadowColor = s.color;
    ctx.shadowBlur  = 18;
    ctx.fill();
    ctx.shadowBlur  = 0;

    if (s.p >= 1) signals.splice(i, 1);
  }
}

/* ═══════════════════════════════════════════
   RENDER LOOP
═══════════════════════════════════════════ */
let T = 0;

function frame() {
  T += .007;
  ctx.clearRect(0, 0, W, H);

  drawSpores();
  drawMembrane(T);
  drawCells(T);
  drawOrganism(T);
  drawTendrils(T);
  drawSignals();

  if (pulse.alpha > 0) pulse.alpha = Math.max(0, pulse.alpha - .013);
  if (pulse.scale > 1) pulse.scale = Math.max(1, pulse.scale - .0025);

  requestAnimationFrame(frame);
}

/* ═══════════════════════════════════════════
   xAPI
═══════════════════════════════════════════ */
const STORAGE_KEY = 'jtld_xapi_statements_v1';

const VERB_COLORS = {
  initialized: '#00d4ff', attempted:   '#8b5cf6',
  completed:   '#10b981', passed:      '#10b981',
  failed:      '#ef4444', answered:    '#f59e0b',
  progressed:  '#e879f9', experienced: '#6366f1',
  interacted:  '#f97316',
};
const CLR_DEFAULT = '#94a3b8';

let statements = [];
function load()  { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { return []; } }
function save(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

function verbOf(s) {
  const id = s?.verb?.id || '', d = s?.verb?.display;
  if (d) { const v = Object.values(d)[0]; if (v) return v.toLowerCase(); }
  return (id.split('/').pop() || 'unknown').toLowerCase();
}

function animCount(to) {
  const el   = document.getElementById('count-num');
  const from = parseInt(el.textContent) || 0;
  if (from === to) return;
  el.style.transform = 'scale(1.32)';
  setTimeout(() => el.style.transform = '', 320);
  const t0 = performance.now(), dur = 700;
  (function step(t) {
    const p = Math.min((t - t0) / dur, 1), e = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.round(from + (to - from) * e);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

function spawnLabel(v, color) {
  const el          = document.createElement('div');
  el.className      = 'evt-label';
  el.textContent    = v;
  el.style.color    = color;
  el.style.textShadow = `0 0 18px ${color}80`;
  const angle = Math.random() * Math.PI * 2;
  const dist  = 95 + Math.random() * 65;
  el.style.left = (OX + Math.cos(angle) * dist) + 'px';
  el.style.top  = (OY + Math.sin(angle) * dist) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

function onStatement(stmt) {
  const v = verbOf(stmt), color = VERB_COLORS[v] || CLR_DEFAULT;
  triggerPulse(color);
  fireSignal(color);
  spawnLabel(v, color);
  animCount(statements.length);
}

/* ═══════════════════════════════════════════
   BOOT
═══════════════════════════════════════════ */
layout();
statements = load();
animCount(statements.length);
frame();

window.addEventListener('message', e => {
  const d = e.data;
  if (!d || d.type !== 'xapi' || !d.statement) return;
  statements.push(d.statement);
  save(statements);
  onStatement(d.statement);
  console.log('[xAPI]', d.statement);
});

document.getElementById('btn-clear').addEventListener('click', () => {
  statements = []; save(statements); animCount(0);
});

document.getElementById('btn-dl').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(statements, null, 2)], { type: 'application/json' });
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob), download: 'xapi-statements.json',
  });
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
