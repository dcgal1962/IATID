<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>AM The Instructional Designer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #030010;
      overflow: hidden;
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #c {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #course {
      position: fixed;
      z-index: 2;
      border: none;
    }

    .brand {
      position: fixed;
      top: 22px;
      left: 26px;
      z-index: 10;
      pointer-events: none;
    }

    .brand-name {
      font-size: 13px;
      font-weight: 700;
      background: linear-gradient(90deg, rgba(255,255,255,.9) 0%, #00d4ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -.01em;
    }

    .brand-sub {
      display: block;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255,255,255,.25);
      margin-top: 3px;
    }

    .actions {
      position: fixed;
      top: 18px;
      right: 22px;
      z-index: 10;
      display: flex;
      gap: 8px;
    }

    .pill {
      padding: 7px 18px;
      border-radius: 99px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.03);
      color: rgba(255,255,255,.42);
      font: 500 11px 'Inter', sans-serif;
      cursor: pointer;
      transition: all .25s;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .pill:hover {
      background: rgba(0,212,255,.1);
      border-color: rgba(0,212,255,.35);
      color: #00d4ff;
    }

    .live {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(16,185,129,.55);
      pointer-events: none;
    }

    .live-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 7px #10b981;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: .2; }
    }

    /* floating verb labels that rise from the organism */
    .evt-label {
      position: fixed;
      z-index: 8;
      pointer-events: none;
      font-size: 10.5px;
      font-weight: 600;
      text-transform: capitalize;
      letter-spacing: .04em;
      transform: translateX(-50%);
      animation: evt-rise 3.8s ease-out forwards;
    }

    @keyframes evt-rise {
      0%   { opacity: 0;   transform: translateX(-50%) translateY(0)    scale(.65); }
      14%  { opacity: 1;   transform: translateX(-50%) translateY(-10px) scale(1);  }
      75%  { opacity: .8;  transform: translateX(-50%) translateY(-44px) scale(.95); }
      100% { opacity: 0;   transform: translateX(-50%) translateY(-80px) scale(.85); }
    }

    /* statement counter lives inside the organism — centered by JS */
    #count-display {
      position: fixed;
      z-index: 6;
      pointer-events: none;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    #count-num {
      display: block;
      font-size: 54px;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #00d4ff 0%, #8b5cf6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -.04em;
      transition: transform .28s cubic-bezier(.175,.885,.32,1.275);
    }

    #count-lbl {
      display: block;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(0,212,255,.38);
      margin-top: 5px;
    }
  </style>
</head>
<body>

<canvas id="c"></canvas>

<iframe id="course" src="story.html"
  title="Learning Engineer Dashboard"
  allow="autoplay; fullscreen">
</iframe>

<div class="brand">
  <div class="brand-name">AM The Instructional Designer</div>
  <span class="brand-sub">Learning Engineer · xAPI Live</span>
</div>

<div class="actions">
  <button class="pill" id="btn-clear">Clear</button>
  <button class="pill" id="btn-dl">Export JSON</button>
</div>

<div class="live">
  <div class="live-dot"></div>
  xAPI Live Capture
</div>

<div id="count-display">
  <span id="count-num">0</span>
  <span id="count-lbl">statements</span>
</div>

<script>
'use strict';

/* ─── CANVAS ─────────────────────────────────────── */
const C   = document.getElementById('c');
const ctx = C.getContext('2d');
let W, H, OX, OY, IX, IY, IW, IH;

function layout() {
  W = C.width  = window.innerWidth;
  H = C.height = window.innerHeight;
  OX = W * 0.795;
  OY = H * 0.500;

  IW = W * 0.555;
  IH = H * 0.880;
  IX = W * 0.024;
  IY = (H - IH) * 0.5;

  const fr = document.getElementById('course');
  fr.style.left   = IX + 'px';
  fr.style.top    = IY + 'px';
  fr.style.width  = IW + 'px';
  fr.style.height = IH + 'px';

  const cd = document.getElementById('count-display');
  cd.style.left = OX + 'px';
  cd.style.top  = OY + 'px';
}

window.addEventListener('resize', layout);

/* ─── NOISE (3-octave fBm) ───────────────────────── */
function fbm(x, y, t) {
  return (
    Math.sin(x * 2.10 + t)        * Math.cos(y * 1.90 - t * .70) * .500 +
    Math.sin(x * 4.30 - t * .90)  * Math.cos(y * 3.80 + t * .40) * .250 +
    Math.sin(x * 8.10 + y * 6.50 + t * 1.30)                     * .125
  );
}

/* ─── BLOB VERTICES ──────────────────────────────── */
function blobPts(cx, cy, r, freq, amp, t, spd, N) {
  N = N || 64;
  const pts = new Array(N);
  for (let i = 0; i < N; i++) {
    const a = (i / N) * Math.PI * 2;
    const d = r + fbm(Math.cos(a) * freq, Math.sin(a) * freq, t * spd) * amp;
    pts[i] = { x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d };
  }
  return pts;
}

/* ─── SMOOTH POLYGON ─────────────────────────────── */
function smoothPath(pts) {
  const n = pts.length;
  ctx.beginPath();
  ctx.moveTo((pts[0].x + pts[n-1].x) * .5, (pts[0].y + pts[n-1].y) * .5);
  for (let i = 0; i < n; i++) {
    const a = pts[i], b = pts[(i+1) % n];
    ctx.quadraticCurveTo(a.x, a.y, (a.x+b.x)*.5, (a.y+b.y)*.5);
  }
  ctx.closePath();
}

/* ─── HEX → "r,g,b" ─────────────────────────────── */
function rgb(hex) {
  return `${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)}`;
}

/* ─── PULSE STATE ────────────────────────────────── */
const pulse = { color: '#00d4ff', alpha: 0, scale: 1 };

function triggerPulse(color) {
  pulse.color = color;
  pulse.alpha = 1;
  pulse.scale = 1.15;
}

/* ─── ORGANISM ───────────────────────────────────── */
function drawOrganism(t) {
  const cx = OX, cy = OY, ps = pulse.scale;
  const pa = pulse.alpha, pc = pulse.color;

  /* aura */
  smoothPath(blobPts(cx, cy, 265*ps, 0.65, 58, t, 0.11));
  { const g = ctx.createRadialGradient(cx,cy,0, cx,cy, 340*ps);
    g.addColorStop(0, 'rgba(139,92,246,.07)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fill(); }

  /* body */
  { const pts = blobPts(cx, cy, 162*ps, 1.0, 44, t, 0.21);
    smoothPath(pts);
    const g = ctx.createRadialGradient(cx,cy,0, cx,cy, 220*ps);
    const inner = pa > 0
      ? `rgba(${rgb(pc)},${.30 + pa*.22})`
      : 'rgba(139,92,246,.32)';
    g.addColorStop(0,   inner);
    g.addColorStop(.55, 'rgba(50,15,110,.18)');
    g.addColorStop(1,   'rgba(0,212,255,0)');
    ctx.fillStyle = g; ctx.fill();
    const glow = (Math.sin(t*1.2)+1)*.5;
    ctx.strokeStyle = `rgba(139,92,246,${.06+glow*.07})`;
    ctx.lineWidth = 1;
    ctx.stroke(); }

  /* core */
  { smoothPath(blobPts(cx, cy, 82*ps, 1.55, 22, t, 0.38));
    const g = ctx.createRadialGradient(cx,cy,0, cx,cy, 110*ps);
    const inner = pa > 0
      ? `rgba(${rgb(pc)},${.40 + pa*.30})`
      : 'rgba(0,212,255,.42)';
    g.addColorStop(0, inner);
    g.addColorStop(1, 'rgba(139,92,246,.08)');
    ctx.fillStyle = g; ctx.fill(); }

  /* nucleus */
  { smoothPath(blobPts(cx, cy, 30*ps, 2.2, 9, t, 0.58));
    const g = ctx.createRadialGradient(cx,cy,0, cx,cy, 44*ps);
    g.addColorStop(0,   'rgba(255,255,255,.70)');
    g.addColorStop(.35, 'rgba(0,212,255,.52)');
    g.addColorStop(1,   'rgba(0,212,255,0)');
    ctx.fillStyle = g; ctx.fill(); }

  /* shockwave ring */
  if (pa > 0) {
    const ringR = 75*ps + (1-pa)*150;
    ctx.beginPath();
    ctx.arc(cx, cy, ringR, 0, Math.PI*2);
    const hexA = Math.floor(pa*255).toString(16).padStart(2,'0');
    ctx.strokeStyle = pc + hexA;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

/* ─── SATELLITE CELLS ────────────────────────────── */
const PALETTES = [
  ['rgba(0,212,255,.26)',   'rgba(0,212,255,0)'],
  ['rgba(139,92,246,.26)',  'rgba(139,92,246,0)'],
  ['rgba(232,121,249,.20)', 'rgba(232,121,249,0)'],
  ['rgba(16,185,129,.20)',  'rgba(16,185,129,0)'],
  ['rgba(99,102,241,.23)',  'rgba(99,102,241,0)'],
  ['rgba(249,115,22,.18)',  'rgba(249,115,22,0)'],
  ['rgba(0,212,255,.15)',   'rgba(0,212,255,0)'],
];

const cells = Array.from({length: 7}, (_, i) => ({
  angle:  (i / 7) * Math.PI * 2,
  orbitA: 188 + Math.random() * 100,
  orbitB: 108 + Math.random() * 65,
  spd:    (.0011 + Math.random() * .0017) * (Math.random() < .5 ? 1 : -1),
  r:      22 + Math.random() * 34,
  phase:  Math.random() * Math.PI * 2,
  pal:    PALETTES[i],
  freq:   .8  + Math.random() * .9,
  amp:    7   + Math.random() * 11,
  bspd:   .28 + Math.random() * .45,
}));

function drawCells(t) {
  for (const cell of cells) {
    cell.angle += cell.spd;
    const cx = OX + Math.cos(cell.angle) * cell.orbitA;
    const cy = OY + Math.sin(cell.angle) * cell.orbitB;
    const r  = cell.r + Math.sin(t * cell.bspd + cell.phase) * 7;

    smoothPath(blobPts(cx, cy, r, cell.freq, cell.amp, t, cell.bspd, 36));
    const g = ctx.createRadialGradient(cx,cy,0, cx,cy, r+14);
    g.addColorStop(0, cell.pal[0]);
    g.addColorStop(1, cell.pal[1]);
    ctx.fillStyle = g; ctx.fill();

    /* tendril to nucleus */
    const a = .03 + Math.abs(Math.sin(cell.angle*2))*.04;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    const mx = (cx+OX)*.5 + Math.sin(t+cell.phase)*28;
    const my = (cy+OY)*.5 + Math.cos(t+cell.phase)*18;
    ctx.quadraticCurveTo(mx, my, OX, OY);
    ctx.strokeStyle = `rgba(0,212,255,${a})`;
    ctx.lineWidth = .5;
    ctx.stroke();
  }
}

/* ─── AMBIENT SPORES ─────────────────────────────── */
const spores = Array.from({length: 55}, () => ({}));

function resetSpore(s) {
  s.x     = Math.random() * W;
  s.y     = Math.random() * H;
  s.vx    = (Math.random()-.5)*.32;
  s.vy    = (Math.random()-.5)*.32;
  s.r     = Math.random()*1.3 + .3;
  s.alpha = Math.random()*.32 + .05;
  s.col   = Math.random() < .6 ? '0,212,255' : '139,92,246';
}

spores.forEach(resetSpore);

function drawSpores() {
  for (const s of spores) {
    s.x += s.vx; s.y += s.vy;
    if (s.x < -4 || s.x > W+4 || s.y < -4 || s.y > H+4) resetSpore(s);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = `rgba(${s.col},${s.alpha})`;
    ctx.fill();
  }
}

/* ─── COURSE MEMBRANE ────────────────────────────── */
function drawMembrane(t) {
  if (!IW) return;
  const pad = 18;
  const x0 = IX-pad, y0 = IY-pad;
  const x1 = IX+IW+pad, y1 = IY+IH+pad;
  const N = 100, pts = new Array(N);

  for (let i = 0; i < N; i++) {
    const p = i/N;
    let bx, by;
    if      (p < .25) { const r=p/.25;       bx=x0+r*(x1-x0); by=y0; }
    else if (p < .50) { const r=(p-.25)/.25; bx=x1;           by=y0+r*(y1-y0); }
    else if (p < .75) { const r=(p-.50)/.25; bx=x1-r*(x1-x0); by=y1; }
    else              { const r=(p-.75)/.25; bx=x0;           by=y1-r*(y1-y0); }

    const a  = i/N * Math.PI * 2;
    const n  = fbm(Math.cos(a)*1.5, Math.sin(a)*1.5, t*.33) * 11;
    const nx = Math.cos(a + Math.PI*.5);
    const ny = Math.sin(a + Math.PI*.5);
    pts[i] = { x: bx + nx*n, y: by + ny*n };
  }

  smoothPath(pts);
  const glow = (Math.sin(t*.85)+1)*.5;
  ctx.strokeStyle = `rgba(0,212,255,${.10 + glow*.09})`;
  ctx.lineWidth = 1.2;
  ctx.shadowColor = '#00d4ff';
  ctx.shadowBlur  = 14;
  ctx.stroke();
  ctx.shadowBlur = 0;

  smoothPath(pts);
  const g = ctx.createLinearGradient(x0,y0, x1,y1);
  g.addColorStop(0, 'rgba(0,212,255,.012)');
  g.addColorStop(1, 'rgba(139,92,246,.008)');
  ctx.fillStyle = g;
  ctx.fill();
}

/* ─── NERVE SIGNALS ──────────────────────────────── */
const signals = [];

function fireSignal(color) {
  const sx = IX + IW;
  const sy = IY + IH * (.32 + Math.random() * .36);
  signals.push({
    sx, sy, ex: OX, ey: OY,
    mx: (sx+OX)*.5 + (Math.random()-.5)*90,
    my: (sy+OY)*.5 + (Math.random()-.5)*55 - 35,
    color, p: 0,
    spd: .011 + Math.random()*.008,
  });
}

function drawSignals() {
  for (let i = signals.length-1; i >= 0; i--) {
    const s = signals[i];
    s.p = Math.min(s.p + s.spd, 1);

    /* bezier head position */
    const u  = s.p, v = 1-u;
    const hx = v*v*s.sx + 2*v*u*s.mx + u*u*s.ex;
    const hy = v*v*s.sy + 2*v*u*s.my + u*u*s.ey;

    /* fading trail along [p-0.18, p] */
    const t0 = Math.max(0, s.p-.18);
    ctx.beginPath();
    let first = true;
    for (let k = 0; k <= 14; k++) {
      const tk = t0 + (s.p-t0)*(k/14);
      const vk = 1-tk;
      const px = vk*vk*s.sx + 2*vk*tk*s.mx + tk*tk*s.ex;
      const py = vk*vk*s.sy + 2*vk*tk*s.my + tk*tk*s.ey;
      if (first) { ctx.moveTo(px,py); first=false; } else ctx.lineTo(px,py);
    }
    const alpha = Math.sin(s.p * Math.PI) * .85;
    ctx.strokeStyle = `rgba(${rgb(s.color)},${alpha})`;
    ctx.lineWidth   = 1.5;
    ctx.shadowColor = s.color;
    ctx.shadowBlur  = 9;
    ctx.stroke();
    ctx.shadowBlur  = 0;

    /* bright head */
    ctx.beginPath();
    ctx.arc(hx, hy, 3.5, 0, Math.PI*2);
    ctx.fillStyle   = s.color;
    ctx.shadowColor = s.color;
    ctx.shadowBlur  = 18;
    ctx.fill();
    ctx.shadowBlur  = 0;

    if (s.p >= 1) signals.splice(i, 1);
  }
}

/* ─── RENDER LOOP ────────────────────────────────── */
let T = 0;

function frame() {
  T += .007;
  ctx.clearRect(0, 0, W, H);

  drawSpores();
  drawMembrane(T);
  drawCells(T);
  drawOrganism(T);
  drawSignals();

  /* decay pulse */
  if (pulse.alpha > 0) pulse.alpha = Math.max(0, pulse.alpha - .014);
  if (pulse.scale > 1) pulse.scale = Math.max(1, pulse.scale - .002);

  requestAnimationFrame(frame);
}

/* ─── xAPI ───────────────────────────────────────── */
const STORAGE_KEY = 'jtld_xapi_statements_v1';

const VERB_COLORS = {
  initialized: '#00d4ff', attempted: '#8b5cf6',
  completed:   '#10b981', passed:    '#10b981',
  failed:      '#ef4444', answered:  '#f59e0b',
  progressed:  '#e879f9', experienced:'#6366f1',
  interacted:  '#f97316',
};
const CLR_DEFAULT = '#94a3b8';

let statements = [];

function load()  { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); } catch { return []; } }
function save(s) { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

function verbOf(s) {
  const id = s?.verb?.id || '';
  const d  = s?.verb?.display;
  if (d) { const v = Object.values(d)[0]; if (v) return v.toLowerCase(); }
  return (id.split('/').pop() || 'unknown').toLowerCase();
}

function animCount(to) {
  const el   = document.getElementById('count-num');
  const from = parseInt(el.textContent) || 0;
  if (from === to) return;
  const t0 = performance.now(), dur = 700;
  el.style.transform = 'scale(1.25)';
  setTimeout(() => el.style.transform = '', 320);
  (function step(t) {
    const p = Math.min((t-t0)/dur, 1);
    const e = 1 - Math.pow(1-p, 3);
    el.textContent = Math.round(from + (to-from)*e);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

function spawnLabel(v, color) {
  const el  = document.createElement('div');
  el.className    = 'evt-label';
  el.textContent  = v;
  el.style.color  = color;
  el.style.textShadow = `0 0 16px ${color}80`;
  const angle = Math.random() * Math.PI * 2;
  const dist  = 90 + Math.random() * 65;
  el.style.left = (OX + Math.cos(angle)*dist) + 'px';
  el.style.top  = (OY + Math.sin(angle)*dist) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

function onStatement(stmt) {
  const v     = verbOf(stmt);
  const color = VERB_COLORS[v] || CLR_DEFAULT;
  triggerPulse(color);
  fireSignal(color);
  spawnLabel(v, color);
  animCount(statements.length);
}

/* ─── BOOT ───────────────────────────────────────── */
layout();
statements = load();
animCount(statements.length);
frame();

window.addEventListener('message', e => {
  const d = e.data;
  if (!d || d.type !== 'xapi' || !d.statement) return;
  statements.push(d.statement);
  save(statements);
  onStatement(d.statement);
  console.log('[xAPI]', d.statement);
});

document.getElementById('btn-clear').addEventListener('click', () => {
  statements = []; save(statements); animCount(0);
});

document.getElementById('btn-dl').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(statements,null,2)],{type:'application/json'});
  const a = Object.assign(document.createElement('a'), {
    href: URL.createObjectURL(blob), download: 'xapi-statements.json',
  });
  a.click();
  URL.revokeObjectURL(a.href);
});
</script>
</body>
</html>
